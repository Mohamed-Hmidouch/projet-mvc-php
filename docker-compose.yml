version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: MVC_postgres
    restart: always
    environment:
      POSTGRES_DB: MVC
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: mvc_php
    restart: always
    volumes:
      - .:/var/www
      - ./public:/var/www/html
    ports:
      - "80:80"
    depends_on:
      - postgres

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mvc_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com 
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80" 
    depends_on:
      - postgres

volumes:
  postgres_data: